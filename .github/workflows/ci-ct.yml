name: CI/CT

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean install -DskipTests

      - name: Run tests
        run: xvfb-run mvn test

      - name: Generate JaCoCo coverage report
        id: jacoco
        run: mvn jacoco:report

      - name: Upload coverage report
        if: success() && steps.jacoco.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 30

      - name: Cleanup temporary files
        if: always()
        run: |
          rm -rf target/*.tmp 2>/dev/null || true
          echo "Cleanup completed"

      - name: Notify success
        if: success()
        run: echo "✅ Build and tests completed successfully"

      - name: Notify failure
        if: failure()
        run: echo "❌ Build or tests failed. Please check the logs for details."
